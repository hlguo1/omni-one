apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-one
  namespace: omni-one
  labels:
    app.kubernetes.io/name: omni-one
    app.kubernetes.io/version: "1.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: omni-one
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omni-one
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: omni-one
          image: omni-one:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5003
          envFrom:
            - configMapRef:
                name: omni-one-config
          env:
            - name: PORT
              value: "5003"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: omni-data
              mountPath: /app/data
      volumes:
        - name: omni-data
          persistentVolumeClaim:
            claimName: omni-one-data
