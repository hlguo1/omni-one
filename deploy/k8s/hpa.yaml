apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omni-one
  namespace: omni-one
  labels:
    app.kubernetes.io/name: omni-one
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omni-one
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
