# EXAMPLE ONLY — SealedSecret template for omni-one.
# NEVER commit real secrets. Real flow:
#   1. kubectl create secret generic omni-one-secrets \
#        --from-literal=VALID_API_KEYS="$(openssl rand -hex 32)" -n omni-one \
#        --dry-run=client -o yaml | kubeseal -o yaml > sealed-secret.yaml
#   2. Commit ONLY the kubeseal-encrypted output (this file shape).
# Sealed Secrets must be created with YOUR cluster's kubeseal cert —
# the ciphertext below is a placeholder and will NOT decrypt anywhere.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: omni-one-secrets
  namespace: omni-one
  labels:
    app.kubernetes.io/name: omni-one
spec:
  encryptedData:
    # Replace with kubeseal output. Placeholder (base64 of "REPLACE_ME"):
    VALID_API_KEYS: UkVQTEFDRV9NRQ==
  template:
    metadata:
      name: omni-one-secrets
      namespace: omni-one
    type: Opaque
