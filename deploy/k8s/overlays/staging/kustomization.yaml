apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omni-one
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: omni-one
  environment: staging
# Base is the existing deploy/k8s/*.yaml files, referenced explicitly
# (there is no deploy/k8s/base/ directory in this repo).
resources:
  - ../../namespace.yaml
  - ../../configmap.yaml
  - ../../deployment.yaml
  - ../../service.yaml
  - ../../ingress.yaml
  - ../../hpa.yaml
  - ../../pdb.yaml
  - ../../networkpolicy.yaml
patchesStrategicMerge:
  - staging.patch.yaml
images:
  - name: omni-one
    newName: omni-one
    newTag: staging
