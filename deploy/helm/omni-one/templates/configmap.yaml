apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omni-one.fullname" . }}-config
  labels:
    {{- include "omni-one.labels" . | nindent 4 }}
data:
  SELLER_LLM: {{ .Values.env.SELLER_LLM | quote }}
  DUCKDB_PATH: {{ .Values.env.DUCKDB_PATH | quote }}
  AUDIT_PATH: {{ .Values.env.AUDIT_PATH | quote }}
  OMNI_DATA_DIR: {{ .Values.env.OMNI_DATA_DIR | quote }}
  SELLER_INBOX: {{ .Values.env.SELLER_INBOX | quote }}
  PORT: {{ .Values.env.PORT | quote }}
